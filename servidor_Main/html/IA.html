<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IA</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background-color: #050b1a;
            font-family: Arial, sans-serif;
        }

        .caixa {
            width: 70%;
            max-width: 900px;
            min-height: 300px;

            background-color: rgba(0, 0, 0, 0.4);

            border-radius: 20px;
            border: 2px solid white;

            display: flex;
            justify-content: center;
            align-items: center;

            text-align: center;
            color: white;

            box-shadow: 0 0 20px white;
        }

        h1 {
            font-size: 50px;
            text-shadow: 0 0 10px white;
        }
    </style>
</head>

<body>

    <div class="caixa">
        <h1>A AI está Rodando</h1>
    </div>

</body>
</html>
