<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IA</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background-color: #050b1a;
            font-family: Arial, sans-serif;
        }

        .caixa {
            background-color: rgba(0, 0, 0, 0.4);
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            color: white;
            box-shadow: 0 0 20px white;
        }

        h1 {
            font-size: 40px;
            text-shadow: 0 0 10px white;
        }

        p {
            font-size: 20px;
        }

        .botao-ia {
            display: inline-block;
            margin-top: 20px;
            padding: 15px 30px;

            background-color: #0066ff;
            color: white;

            text-decoration: none;
            font-size: 20px;
            font-weight: bold;

            border-radius: 10px;

            box-shadow: 0 0 15px #0066ff;

            transition: 0.3s;
        }

        .botao-ia:hover {
            box-shadow: 0 0 30px #0066ff;
            transform: scale(1.05);
        }
    </style>

</head>

<body>

    <div class="caixa">

        <h1>A AI está Rodando</h1>

        <p>O sistema está funcionando normalmente.</p>

        <a href="/IA" class="botao-ia">
            Entrar na IA
        </a>

    </div>

</body>

</html>
