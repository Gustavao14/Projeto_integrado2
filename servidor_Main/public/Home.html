<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Main Modulation</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;

            background-color: #050b1a;
            font-family: Arial, sans-serif;
        }

        .VolumeRadio, .class {
            background-color: rgba(15, 23, 42, 0.85);
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 25px rgba(0, 102, 255, 0.25);
            max-width: 400px;
        }

        h1 {
            font-size: 32px;
            color: #ffffff;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
            margin-top: 0;
        }

        p {
            font-size: 18px;
            color: #e2e8f0;
            line-height: 1.5;
        }

        .botao-ia {
            display: inline-block;
            margin-top: 20px;
            padding: 15px 30px;

            background-color: #0066ff;
            color: #ffffff;

            text-decoration: none;
            font-size: 18px;
            font-weight: bold;

            border-radius: 10px;

            box-shadow: 0 0 15px #0066ff;

            transition: 0.3s;
        }

        .botao-ia:hover {
            box-shadow: 0 0 30px #0066ff;
            transform: scale(1.05);
        }
    </style>

</head>

<body>
 
    <div class="VolumeRadio">
        <h1>insira a musica e controle seu volume</h1>

        <p>O sistema está funcionando normalmente.</p>

        <a href="/IA" class="botao-ia">
            entrar na Sound Station
        </a>
    </div>

    <div class="class">
        <h1>a IA está Rodando</h1>

        <p>O sistema está funcionando normalmente.</p>

        <a href="/IA" class="botao-ia">
            Entrar na IA
        </a>
    </div>

</body>

</html>
