<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TreckSound</title>
    <link rel="icon" type="image/jpeg" href="/logo.jpeg">
    <style>
        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            background-color: #050b1a;
            font-family: Arial, sans-serif;
            padding: 20px 0;
            box-sizing: border-box;
        }

        .caixa {
            width: 70%;
            max-width: 900px;
            min-height: 300px;

            background-color: rgba(4, 217, 255, 0.4);

            border-radius: 20px;
            border: 2px solid white;

            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: stretch;
            padding: 20px;
            box-sizing: border-box;

            text-align: center;
            color: white;

            box-shadow: 0 0 20px white;
        }

        .instrucao {
            background-color: transparent;
            text-align: center;
            color: white;
            margin-bottom: 20px;
        }

        .instrucao h1 {
            font-size: 28px;
            font-weight: bold;
            text-shadow: 0 0 15px #04d9ff, 0 0 25px #04d9ff;
        }

        h1 {
            font-size: 40px;
            text-shadow: 0 0 10px white;
        }

        #historico {
            flex: 1;
            min-height: 200px;
            max-height: 400px;
            overflow-y: auto;
            text-align: left;
            margin-bottom: 15px;
        }

        .mensagem {
            padding: 8px 12px;
            margin: 6px 0;
            border-radius: 10px;
            max-width: 80%;
        }

        .mensagem.usuario {
            background-color: rgba(255, 255, 255, 0.3);
            margin-left: auto;
            text-align: right;
        }

        .mensagem.ia {
            background-color: rgba(0, 0, 0, 0.3);
            margin-right: auto;
            text-align: left;
        }

        .input-area {
            display: flex;
            gap: 10px;
        }

        #mensagem-input {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            border: none;
        }

        button {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            background-color: white;
            cursor: pointer;
            font-weight: bold;
        }

        /* Estilização do Botão Voltar */
        .voltar {
            display: inline-block;
            margin-top: 30px; /* Afasta o botão da caixa para baixo */
            padding: 10px 20px;
            background-color: rgba(4, 217, 255, 0.2);
            color: #04d9ff;
            border: 2px solid #04d9ff;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(4, 217, 255, 0.5);
            transition: all 0.3s ease;
        }

        .voltar:hover {
            background-color: #04d9ff;
            color: #050b1a;
            box-shadow: 0 0 20px #04d9ff;
        }
    </style>
</head>

<body>

<div class="instrucao">
    <h1>Para começar a conversa digite "quero indicações"!!</h1>
</div>

    <div class="caixa">
        <h1>TreckSound</h1>
        <div id="historico"></div>
        <div class="input-area">
            <input type="text" id="mensagem-input" placeholder="Digite sua mensagem..." onkeydown="if(event.key==='Enter') enviarMensagem()">
            <button onclick="enviarMensagem()">Enviar</button>
        </div>
    </div>
    
    <div>
        <a href="/" class="voltar">
            ← Voltar para Home
        </a>
    </div>
    <script>
        async function enviarMensagem() {
            const input = document.getElementById('mensagem-input');
            const historicoDiv = document.getElementById('historico');
            const texto = input.value.trim();

            if (!texto) return;

            input.value = '';

            historicoDiv.innerHTML += `<div class="mensagem usuario">${texto}</div>`;
            historicoDiv.scrollTop = historicoDiv.scrollHeight;

            const idAguardando = 'ia-' + Date.now();
            historicoDiv.innerHTML += `<div class="mensagem ia" id="${idAguardando}">Digitando...</div>`;
            historicoDiv.scrollTop = historicoDiv.scrollHeight;

            try {
                const resposta = await fetch('http://localhost:3000/trecksound', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: texto })
                });

                const dados = await resposta.json();

                document.getElementById(idAguardando).innerText = dados.resposta || dados.erro;
                historicoDiv.scrollTop = historicoDiv.scrollHeight;

            } catch (erro) {
                document.getElementById(idAguardando).innerText = "Erro ao conectar com a IA.";
            }
        }
    </script>
</body>
</html>
