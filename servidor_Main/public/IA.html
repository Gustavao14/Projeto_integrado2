<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://jsdelivr.net"></script>
    <title>TreckSound</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background-color: #050b1a;
            font-family: Arial, sans-serif;
        }

        .caixa {
            width: 70%;
            max-width: 900px;
            min-height: 300px;

            background-color: rgba(4, 217, 255, 0.4);

            border-radius: 20px;
            border: 2px solid white;

            display: flex;
            justify-content: center;
            align-items: center;

            text-align: center;
            color: white;

            box-shadow: 0 0 20px white;
        }

        h1 {
            font-size: 50px;
            text-shadow: 0 0 10px white;
        }
    </style>
</head>

<body>

    <div>
        <button onclick="TreckSound"> Ir para TreckSound</button>
        <script>
         async function enviarMensagem() {
         const input = document.getElementById('mensagem-input');
         const historicoDiv = document.getElementById('historico');
         const texto = input.value.trim();
    
    if (!texto) return;

    input.value = ''; // Limpa o campo de digitação

    // 1. Mostra a mensagem do usuário na tela
    historicoDiv.innerHTML += `<div class="mensagem usuario">${texto}</div>`;
    historicoDiv.scrollTop = historicoDiv.scrollHeight;

    // 2. Cria o balão de "Digitando..."
    const idAguardando = 'ia-' + Date.now();
    historicoDiv.innerHTML += `<div class="mensagem ia" id="${idAguardando}">Digitando...</div>`;
    historicoDiv.scrollTop = historicoDiv.scrollHeight;

    try {
        // 3. Chame o seu servidor Node.js
        const resposta = await fetch('http://localhost:3000/TrecksoundAI', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ mensagemUsuario: texto })
        });

        const dados = await resposta.json();

        // 4. Substitui o carregamento pela resposta da IA
        document.getElementById(idAguardando).innerText = dados.resposta;
        historicoDiv.scrollTop = historicoDiv.scrollHeight;

    } catch (erro) {
        document.getElementById(idAguardando).innerText = "Erro ao conectar com a IA.";
    }
}

        </script>
    </div>
</body>
</html>
